# ===========================================
# 本番環境用 Docker Compose設定
# 使い方: docker compose -f docker-compose.prod.yml up -d --build
# 前提:   .env を用意（.env.production.example を参照）
#         docker network create shared （COCO LAB nginx と繋ぐ共有ネット）
# ===========================================
services:
  # データベース（外部公開しない）
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  # バックエンド（Hono・本番起動）
  backend:
    build: ./backend
    command: sh docker-entrypoint.prod.sh
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # フロント配信＋APIリバースプロキシ（内部nginx）
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:8081:80" # ローカル確認用（外部公開はCOCO LAB nginx経由）
    depends_on:
      - backend
    networks:
      default: {}
      shared:
        aliases:
          - minijira-web # COCO LAB nginx はこの名前で参照する
    restart: always

# COCO LAB nginx と mini-jira を繋ぐ共有ネットワーク（事前に作成）
networks:
  shared:
    external: true

volumes:
  pgdata:
