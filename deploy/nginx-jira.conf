# ============================================================
#  jira.coco-lab.io — mini-jira 相乗り設定
#  COCO LAB(myblog) の docker/nginx.prod.conf の http { ... } の
#  「中」に、この2つの server ブロックを貼り付ける。
#
#  前提:
#   - COCO LAB nginx が共有ネットワーク "shared" に参加している
#   - mini-jira の web コンテナが同じ "shared" 上に minijira-web という別名で居る
#   - jira.coco-lab.io のDNS Aレコードが VPS を指している
#   - certbot で jira.coco-lab.io の証明書を取得済み
#  （詳細は deploy/DEPLOY.md 参照）
# ============================================================

# ---- HTTP(80): 証明書チャレンジ応答 + HTTPSへリダイレクト ----
server {
    listen 80;
    server_name jira.coco-lab.io;

    # Let's Encrypt の取得・更新チャレンジ
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS(443): mini-jira へ中継 ----
server {
    listen 443 ssl;
    http2 on;
    server_name jira.coco-lab.io;

    ssl_certificate     /etc/letsencrypt/live/jira.coco-lab.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jira.coco-lab.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- セキュリティヘッダ（myblog流用・アプリ側secureHeadersと二重の防御）---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    # CSPは最初は Report-Only で様子見。違反ゼロを1週間確認したら
    # "Content-Security-Policy"（-Report-Only を外す）に切り替える。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    client_max_body_size 5M;

    # DockerのDNS(127.0.0.11)で名前解決を「実行時」に行う。
    # これにより mini-jira が一時停止中でも nginx は起動でき、
    # coco-lab.io 側を巻き込まない（落ちてる間は 502 を返すだけ）。
    resolver 127.0.0.11 valid=30s;
    set $minijira_web http://minijira-web:80;

    # mini-jira の内部nginx(web)へ中継（共有ネットワーク経由・コンテナ別名で解決）
    location / {
        proxy_pass $minijira_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
